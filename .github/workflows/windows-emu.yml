name: Windows Emulator Smoke

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup GNU Make
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }

      - name: Extract ASL toolchain
        shell: pwsh
        run: |
          $zip = Get-ChildItem third_party/asl/*.zip | Select-Object -First 1
          if (-not $zip) {
            throw "ASL zip not found under third_party/asl"
          }
          Expand-Archive -Path $zip.FullName -DestinationPath third_party/asl -Force
          $asl = Get-ChildItem third_party/asl -Recurse -File -Filter asl.exe | Select-Object -First 1
          if (-not $asl) {
            throw "asl.exe not found after extracting ASL zip"
          }
          $root = Split-Path -Parent (Split-Path -Parent $asl.FullName)
          "ASL_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build ROM binaries
        shell: pwsh
        run: |
          make bin ASL="$env:ASL_ROOT\bin\asl.exe" P2BIN="$env:ASL_ROOT\bin\p2bin.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          make bin MONITOR_PROFILE=sbcio ASL="$env:ASL_ROOT\bin\asl.exe" P2BIN="$env:ASL_ROOT\bin\p2bin.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run emulator smoke tests
        env:
          REQUIRE_BUILD_ROM: "1"
        run: |
          python tests/test_smoke.py
          python tests/test_sd_fixture.py
          $env:MONITOR_PROFILE='sbcio'
          $env:MONITOR_ROM_PATH='build/mc6800-monitor-sbcio.bin'
          $env:MONITOR_LST_PATH='build/mc6800-monitor-sbcio.lst'
          python tests/test_smoke.py
          python tests/test_sd_fixture.py
